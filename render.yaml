services:
  - type: web
    name: zoning-agent-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    rootDir: apps/api
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Still the Supabase pooler URL (dashboard-set). Repointed to
      # zoning-agent-db via fromDatabase in a SECOND blueprint change, only
      # after the dump/restore is verified -- wiring it here would point prod
      # at an empty database the moment this syncs.
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: AUTH_PROVIDER
        value: supabase
      - key: AUTH_REQUIRED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: RAG_PROVIDER
        value: hybrid_local
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
      - key: VECTOR_PROVIDER
        value: qdrant
      # Reindex is an explicit admin action (POST /ingestion/reindex), not a
      # boot-time task. Re-embedding the whole corpus on every deploy blocks the
      # lifespan startup long enough for Render's port scan to time out.
      - key: STARTUP_REINDEX_ENABLED
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        value: https://zoning-agent-platform.vercel.app
      - key: BURST_LLM_LIMIT_PER_MIN
        value: "8"
      - key: DAILY_ANALYSIS_LIMIT_FREE
        value: "3"
      - key: DAILY_ANALYSIS_LIMIT_PRO
        value: "50"
      # Stripe secrets: value pasted in the Render dashboard, never committed.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # GROQ_MODEL is dashboard-managed so blueprint re-syncs do not clobber a
      # tuned model choice; defaults to llama-3.3-70b-versatile when unset.
      - key: GROQ_MODEL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: ADMIN_USER_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  # Replaces Supabase Postgres (Supabase stays for Auth only), which removes the
  # API<->DB egress that blew the free-org quota.
  #
  # basic-256mb (~$7/mo), not free: only ONE free Postgres can be active per
  # Render workspace and that slot is already taken. Paid also buys what the free
  # tier can't -- no 30-day expiry, and point-in-time recovery, which is the
  # stated precondition for taking real Stripe subscriptions.
  #
  # Same region as the API so DB traffic stays on Render's private network and
  # never counts as egress anywhere. That is the whole point of the move, and the
  # reason an external free provider (Neon 5 GB/mo, etc.) does not substitute --
  # a single reindex already spent 11.93 GB.
  #
  # ipAllowList omitted on purpose = allow all, needed for the external restore.
  - name: zoning-agent-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "17"
    databaseName: zoning_agent
    user: zoning_agent
