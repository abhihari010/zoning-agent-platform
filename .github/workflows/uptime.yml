name: Uptime

on:
  schedule:
    # Render free spins down after 15 min idle, and GitHub delays scheduled runs
    # under load, so */15 raced the timeout. */5 tolerates two missed runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping production
    runs-on: ubuntu-latest
    steps:
      # --max-time 90 + retries still cover a cold start (~50s spin-up) for the
      # case where the schedule did drop enough runs to let the instance sleep.
      - name: API /health
        run: >
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90
          https://zoning-agent-api.onrender.com/health
      - name: Web
        run: >
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30
          -o /dev/null https://zoning-agent-platform.vercel.app
      # Auth is a separate host, so /health and the Vercel page both stayed green
      # through a full Supabase outage (2026-08-08) and nothing alerted. This ping
      # also counts as project activity, which is what stops the free-tier
      # inactivity pause that caused that outage in the first place.
      - name: Supabase auth
        run: >
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30
          -o /dev/null https://loaxmpyckircnfliheui.supabase.co/auth/v1/health
