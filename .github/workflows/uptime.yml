name: Uptime

on:
  schedule:
    # Render free spins down after 15 min idle, and GitHub delays scheduled runs
    # under load, so */15 raced the timeout. */5 tolerates two missed runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping production
    runs-on: ubuntu-latest
    steps:
      # --max-time 90 + retries still cover a cold start (~50s spin-up) for the
      # case where the schedule did drop enough runs to let the instance sleep.
      # `curl -f` only fails on a non-2xx status, and /health answers 200 even
      # when its body says the corpus is unserveable -- deliberately, because
      # Render's healthCheckPath is /health and a non-200 restarts the service.
      # So the body has to be asserted here or nothing ever alerts: prod served
      # a 31-point vector index against 34,573 chunks and this cron stayed green
      # the whole time (#217).
      - name: API /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            https://zoning-agent-api.onrender.com/health -o health.json
          cat health.json
          python -c "
          import json, sys
          h = json.load(open('health.json'))
          problems = []
          if not h.get('source_index_ready'):
              problems.append('source_index_ready is false')
          if h.get('vector_provider') != 'none' and not h.get('vector_index_ready'):
              problems.append(
                  f\"vector_index_ready is false ({h.get('vector_count')} vectors \"
                  f\"/ {h.get('chunk_count')} chunks)\"
              )
          if problems:
              sys.exit('unhealthy: ' + '; '.join(problems))
          print('healthy')
          "
      - name: Web
        run: >
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30
          -o /dev/null https://zoning-agent-platform.vercel.app
      # Auth is a separate host, so /health and the Vercel page both stayed green
      # through a full Supabase outage (2026-08-08) and nothing alerted. This ping
      # also counts as project activity, which is what stops the free-tier
      # inactivity pause that caused that outage in the first place.
      #
      # JWKS, not /auth/v1/health: the health and settings routes 401 without an
      # apikey header, and JWKS is both public and the exact dependency that
      # broke -- _decode_supabase_jwt fetches it to verify every ES256 login, so
      # if this 200s with a real key, logins work. grep guards against a 200
      # carrying an empty or malformed key set, which -f alone would pass.
      - name: Supabase auth (JWKS)
        run: >
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30
          https://loaxmpyckircnfliheui.supabase.co/auth/v1/.well-known/jwks.json
          | grep -q '"kty"'
